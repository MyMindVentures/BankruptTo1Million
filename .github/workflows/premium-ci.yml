name: Premium CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.19.0'

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: i18n verification
        run: npm run verify:i18n

      - name: Production build
        run: npm run build

  migration-safety:
    name: SQL migration safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changed migrations are structurally safe
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql' || true)
          if [ -z "$changed_files" ]; then
            echo 'No migration files changed.'
            exit 0
          fi
          echo "$changed_files"
          if printf '%s\n' "$changed_files" | xargs grep -nEi 'drop[[:space:]]+(table|schema|database)|truncate[[:space:]]'; then
            echo 'Destructive SQL detected in changed migrations.' >&2
            exit 1
          fi
          printf '%s\n' "$changed_files" | xargs grep -n 'reports_to_agent_id' >/dev/null
          printf '%s\n' "$changed_files" | xargs grep -n 'admin_get_ai_hierarchy' >/dev/null
          echo 'Changed migration safety checks passed.'
